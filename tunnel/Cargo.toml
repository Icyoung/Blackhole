[package]
name = "tunnel"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "lib"]

[dependencies]
boringtun = "0.6"
x25519-dalek = { version = "=2.0.0-rc.3", features = ["static_secrets"] }
base64 = "0.22"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
